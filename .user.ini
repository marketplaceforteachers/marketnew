; Read by PHP on most cPanel / PHP-FPM hosts. Many hosts default to a 2MB upload limit, which is
; smaller than a typical phone photo; these let a normal photo through. The app still enforces its
; own 10MB-per-image cap (includes/uploads.php) and shows a clear message above that.
upload_max_filesize = 10M
post_max_size = 64M
memory_limit = 256M
